# Prova proves what archetect renders. These proofs render the archetype and then
# drive the result exactly as a developer would — through `just`.
#
# Run `prova` from anywhere in this repo.
#
# Deliberately NO UI-driving plugin. The rendered project carries its own
# XCUITest target instead, and these proofs drive it through `just uitest`:
#
#   * anemnez/prova-macos-ui is private — it requires Minion, which is a paid
#     Anemnez product. A public template cannot require something nobody can buy.
#   * XCUITest ships free with Xcode, drives the app under test, and expresses
#     the same "no anonymous controls" rule. For proving your OWN app that is
#     the right tool; Minion earns its keep driving apps it does not own.
#
# The bar is proven in both directions — one proof requires it green on a clean
# render, another breaks a control on purpose and requires it red.

[run]
proofs = ["proofs"]

# Decodes xcodebuild's result bundle into per-case outcomes. Grepping a build log
# for "TEST SUCCEEDED" cannot tell a passing suite from one that matched zero
# tests, and cannot say WHICH case went red — both of which these proofs assert.
#
# This is a dependency of the PROOFS, not of what the archetype generates. A
# rendered project drives its own suite through `just uitest` and needs nothing
# from the plugin registry.
[plugins]
xcodebuild = "prova-rs/prova-xcodebuild@v1"
